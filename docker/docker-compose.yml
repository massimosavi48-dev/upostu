version: "3.9"

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://upostu:upostu@db:5432/upostu
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=upostu
      - POSTGRES_USER=upostu
      - POSTGRES_PASSWORD=upostu
    ports:
      - "5432:5432"


<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login - UPOSTU</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #000;
        color: #fff;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        padding: 18px;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: #111;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 14px;
        padding: 18px;
        box-shadow: 0 18px 42px rgba(0, 0, 0, 0.55);
      }
      h1 { font-size: 20px; margin: 0 0 14px; }
      label { display: block; text-align: left; font-weight: 700; opacity: 0.9; margin-top: 12px; }
      input, button { width: 100%; padding: 12px 12px; margin-top: 8px; border-radius: 12px; border: none; }
      input { background: rgba(0,0,0,0.25); color: #fff; border: 1px solid rgba(255,255,255,0.12); }
      button { margin-top: 16px; background: #3b82f6; color: #fff; font-weight: 900; cursor: pointer; }
      .muted { opacity: 0.8; font-size: 13px; margin-top: 10px; }
      a { color: #93c5fd; text-decoration: none; font-weight: 800; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Login</h1>
      <form id="login-form">
        <label>Email</label>
        <input name="email" type="email" autocomplete="email" required />

        <label>Password</label>
        <input name="password" type="password" autocomplete="current-password" required minlength="8" />

        <button type="submit">Login</button>
        <div class="muted" id="status"></div>
      </form>
      <div class="muted">
        New here?
        <a href="/register.html">Create account</a>
      </div>
    </div>

    <script>
      const form = document.getElementById("login-form");
      const statusEl = document.getElementById("status");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        statusEl.textContent = "Logging in...";

        const payload = Object.fromEntries(new FormData(form).entries());
        try {
          const res = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            statusEl.textContent = data.detail || "Login failed";
            return;
          }

          // MVP session state (no JWT required by UI flow).
          if (data && data.user && (data.user.uid || data.user.id)) {
            localStorage.setItem("userId", String(data.user.uid || data.user.id));
          }
          if (data && data.access_token) {
            localStorage.setItem("upostu_auth_token", data.access_token);
          }
          if (!localStorage.getItem("upostu_active_car_size")) {
            localStorage.setItem("upostu_active_car_size", "medium");
          }
          window.location.href = "/";
        } catch (err) {
          console.error("Login error:", err);
          statusEl.textContent = "Login failed";
        }
      });
    </script>
  </body>
</html>

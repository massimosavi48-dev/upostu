<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register - UPOSTU</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #000;
        color: #fff;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        padding: 18px;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: #111;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 14px;
        padding: 18px;
        box-shadow: 0 18px 42px rgba(0, 0, 0, 0.55);
      }
      h1 { font-size: 20px; margin: 0 0 14px; }
      label { display: block; text-align: left; font-weight: 700; opacity: 0.9; margin-top: 12px; }
      input, button, select { width: 100%; padding: 12px 12px; margin-top: 8px; border-radius: 12px; border: none; }
      input, select { background: rgba(0,0,0,0.25); color: #fff; border: 1px solid rgba(255,255,255,0.12); }
      button { margin-top: 16px; background: #3b82f6; color: #fff; font-weight: 900; cursor: pointer; }
      .muted { opacity: 0.8; font-size: 13px; margin-top: 10px; }
      a { color: #93c5fd; text-decoration: none; font-weight: 800; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Create your account</h1>
      <form id="register-form">
        <label>Name</label>
        <input name="name" required />

        <label>Surname</label>
        <input name="surname" required />

        <label>Email</label>
        <input name="email" type="email" autocomplete="email" required />

        <label>Password</label>
        <input name="password" type="password" autocomplete="new-password" required minlength="8" />

        <button type="submit">Register</button>
        <div class="muted" id="status"></div>
      </form>
      <div class="muted">
        Already have an account?
        <a href="/login.html">Login</a>
      </div>
    </div>

    <script>
      const form = document.getElementById("register-form");
      const statusEl = document.getElementById("status");

      function getFriendlyErrorMessage(data) {
        const detail = data && data.detail;
        if (typeof detail === "string" && detail.trim()) return detail.trim();
        if (Array.isArray(detail) && detail.length > 0) {
          const first = detail[0] || {};
          if (typeof first === "string" && first.trim()) return first.trim();
          if (first && typeof first.msg === "string" && first.msg.trim()) return first.msg.trim();
        }
        return "Registration failed. Please check your data and try again.";
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const payload = Object.fromEntries(new FormData(form).entries());
        const password = String(payload.password || "");
        if (password.length < 8) {
          statusEl.textContent = "Password must be at least 8 characters.";
          return;
        }

        statusEl.textContent = "Registering...";
        try {
          console.log("Sending register request...");
          const res = await fetch("https://upostu.it/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            statusEl.textContent = getFriendlyErrorMessage(data);
            return;
          }

          if (data && data.user && (data.user.uid || data.user.id)) {
            localStorage.setItem("userId", String(data.user.uid || data.user.id));
          }
          localStorage.setItem("upostu_auth", data.access_token);
          localStorage.setItem("upostu_auth_token", data.access_token);
          // Default active car size used by the map when creating spots.
          localStorage.setItem("upostu_active_car_size", "medium");
          window.location.href = "/";
        } catch (err) {
          console.error("Register error:", err);
          statusEl.textContent = "Network error. Check your connection and try again.";
        }
      });
    </script>
  </body>
</html>

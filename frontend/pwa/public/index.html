<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>UPOSTU</title>

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#111827">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">

<style>
html, body{
  height:100%;
}
body{
  margin:0;
  font-family:Arial;
  background:#111827;
  color:white;
  text-align:center;
  position:relative;
  overflow:hidden;
}

header{
  padding:20px;
}

#map{
  height:100vh;
  width:100%;
  position:absolute;
  top:0;
  left:0;
}

.actions{
  margin:10px;
}

button{
  width:90%;
  padding:18px;
  margin:6px;
  font-size:18px;
  border:none;
  border-radius:14px;
  cursor:pointer;
}

#leave-btn{
  background:#ef4444;
  color:white;
}

#find-btn{
  background:#22c55e;
  color:white;
}

#locate-btn{
  background:#3b82f6;
  color:white;
}

#arrival-info{
  margin:10px;
  padding:10px;
  background:#1f2937;
  border-radius:10px;
}
</style>

</head>

<body>

<header>
<h1>UPOSTU</h1>
<p>Find parking faster</p>
</header>

<section class="actions">

<button id="leave-btn">🚗 LASCIO IL POSTO</button>

<button id="find-btn">🔍 CERCO POSTO</button>

<!-- 🔥 NUOVO -->
<button id="locate-btn">📍 USA LA MIA POSIZIONE</button>

<!-- opzionale test -->
<button onclick="sendTest()">🧪 TEST WEBSOCKET</button>

</section>

<div id="map"></div>

<div id="arrival-info"></div>

<!-- service worker script commented to avoid mobile cache issues -->
<!-- <script src="/sw-register.js"></script> -->
<script>
  // Dev: disable any previously-registered Service Worker (prevents stale mobile cache)
  if (location.hostname === "localhost" || location.hostname === "127.0.0.1") {
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then((regs) => Promise.all(regs.map((r) => r.unregister())))
        .then(() => console.log("Service Worker unregistered (dev)"))
        .catch((e) => console.warn("Service Worker unregister failed:", e));
    }
  }
</script>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<!-- IMPORTANTE: type module -->
<script type="module" src="/main.js"></script>

</body>

</html>
